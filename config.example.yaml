window:
  title_keywords:
  - 学习通            # 学习通PC客户端窗口标题关键词
  capture_method: printwindow   # printwindow / bitblt

llm:
  base_url: https://api.deepseek.com/v1   # OpenAI 兼容 API 地址
  api_key: sk-xxxx                       # 你的 API key
  model: deepseek-chat
  temperature: 0.1
  timeout: 60
  max_retries: 1

action:
  dry_run: true           # true=只模拟不真实点击(首次测试建议开启)
  click_delay:
  - 0.8
  - 1.8
  next_delay:
  - 1.0
  - 2.0
  option_interval:
  - 0.3
  - 0.6
  page_wait: 1.0              # 导航滚动后等待页面稳定(秒)
  fine_scroll_wait: 0.6        # 方向键↓微滚后等待页面稳定(秒)
  fine_scroll_steps: 3         # 方向键↓每次按键数(约50px/次;步幅超过约190px移动检测会失效)
  verify_wait: 0.6             # 点击选项后等待选中高亮生效(秒),再截图验证

ocr:
  confidence_threshold: 0.55
  retry_threshold: 0.3         # 页面识别不完整时降阈值重识别(单字符选项易漏检)

web:                            # 网页版模式(GUI 顶部下拉切换)
  default_browser: ''           # 默认浏览器(edge/chrome),必选;程序将拉起该浏览器的专用实例
  cdp_port: 9222                # 专用浏览器调试端口(独立配置,不影响日常浏览器)
  ext_bridge_port: 9876         # 插件模式本地桥 HTTP 端口
  launch_browser: true          # 插件模式自动拉起带插件的专用浏览器;
                                # false=用日常浏览器(需手动装一次插件:扩展页开
                                # 发者模式→加载解压缩的扩展→选 webextension 目录)
  url_keywords:                 # 学习通页面 URL 特征(用于定位做题标签页)
  - chaoxing
  - mooc
  wait_page_timeout: 180        # 等待用户打开做题页的超时(秒)
  q_delay:                      # 每题作答间隔随机秒数(防检测)
  - 3.0
  - 8.0
  opt_delay:                    # 多选题选项间点击随机秒数
  - 0.5
  - 1.5

log:
  save_to_file: true
  dir: logs
